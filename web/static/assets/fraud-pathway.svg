<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
<title id="title">Fraud journey from phishing to protection</title><desc id="desc">A controlled illustration showing a phishing email, a smishing text, a spoofed login page and a protective shield.</desc>
<defs>
 <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#071c2b"/><stop offset=".55" stop-color="#103b4b"/><stop offset="1" stop-color="#071e31"/></linearGradient>
 <linearGradient id="risk" x1="0" x2="1"><stop stop-color="#ff5d50"/><stop offset="1" stop-color="#ffb24b"/></linearGradient>
 <linearGradient id="safe" x1="0" x2="1"><stop stop-color="#22b9aa"/><stop offset="1" stop-color="#7ce4d6"/></linearGradient>
 <filter id="glow"><feGaussianBlur stdDeviation="7" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
 <filter id="soft"><feGaussianBlur stdDeviation="20"/></filter>
</defs>
<rect width="1200" height="420" rx="24" fill="url(#bg)"/>
<g opacity=".18" fill="none" stroke="#79dfd3"><circle cx="112" cy="88" r="110"/><circle cx="112" cy="88" r="155"/><circle cx="1090" cy="318" r="170"/></g>
